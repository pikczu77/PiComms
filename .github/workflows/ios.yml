name: iOS

on:
  push:
    paths-ignore: ["web/**", ".github/workflows/pages.yml", "README.md"]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Wyślij build do TestFlight"
        type: boolean
        default: true

jobs:
  build:
    name: Kompilacja
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build (symulator, bez podpisu)
        run: |
          xcodebuild build \
            -project PiComms.xcodeproj \
            -scheme PiComms \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  testflight:
    name: TestFlight
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-15
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'pl.pikczu.PiComms' }}
    steps:
      - uses: actions/checkout@v4

      - name: Klucz App Store Connect API
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for name in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!name}" ]; then echo "::error::Brak sekretu dla $name (zobacz README)"; exit 1; fi
          done
          if [ -z "$ASC_KEY_P8" ]; then echo "::error::Brak sekretu ASC_KEY_P8 (zobacz README)"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Archiwum (Release)
        run: |
          xcodebuild archive \
            -project PiComms.xcodeproj \
            -scheme PiComms \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PiComms.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Wysyłka do TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PiComms.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
